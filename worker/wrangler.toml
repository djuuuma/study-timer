VAPID_PUBLIC_KEY = "BB2VZoGjoQvRaLyzNXgNyCdL_gf5m9N2IOJQKLNRhneUbd6rfvpom9v_Yhyu3JUM6Xa3nT6YrwdFjTTobLSRN3w"
VAPID_SUBJECT = "https://djuuuma.github.io/study-timer/"
ALLOWED_ORIGINS = "https://djuuuma.github.io,http://localhost:8765"

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "Device"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Device"]
